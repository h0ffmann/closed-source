# ASD-STE100: one term for one meaning, the same term each time. These are the terms that the
# first STE pass of this paper chose (papers/closed-source/STE100.md, "Pass 1: rewrite"). A
# script, so that a quotation is never checked (SentenceLength.yml says why).
extends: script
message: "The STE text uses one term for one meaning: proprietary is closed source, PID is persistent identifier (papers/closed-source/STE100.md)."
level: error
scope: raw
script: |
  text := import("text")
  matches := []

  // Blank out what is not the STE writer's words, and keep every offset.
  blank := func(s, pat) {
    found := text.re_find(pat, s, -1)
    if found == undefined { return s }
    out := ""
    last := 0
    for f in found {
      m := f[0]
      out += s[last:m.begin] + text.repeat(" ", m.end - m.begin)
      last = m.end
    }
    return out + s[last:]
  }
  s := scope
  for p in [`(?s)\A---\n.*?\n---\n`, `(?s)<!--.*?-->`, "(?s)```.*?```", "`[^`\n]*`", `"[^"]*"`, `“[^”]*”`, `\[-?@[^\]]*\]`, `@[\w:.-]+`, `\{#[^}]*\}`, `<?https?://[^\s>)]+>?`] {
    s = blank(s, p)
  }

  // A sentence ends with ".", "!" or "?" before a space or the end, except after an initial
  // ("M.") or a short abbreviation ("e.g.", "No.").
  abbrev := `^([A-Z]|e\.g|i\.e|etc|No|Art|vs|Inc|Ltd|Co|Mr|Ms|Dr|St|U\.S|al|v)$`
  ends := func(b) {
    out := []
    found := text.re_find(`[.!?]+\**(\s|$)`, b, -1)
    if found == undefined { return out }
    for f in found {
      m := f[0]
      before := b[:m.begin]
      // the number of a numbered item or heading, "**6. Secrecy ...", ends nothing
      if text.re_match(`^\s*\**\d+$`, before) { continue }
      w := text.re_find(`(^|[^A-Za-z0-9])([A-Za-z.]+)$`, before, 1)
      if w != undefined && text.re_match(abbrev, w[0][2].text) { continue }
      out = append(out, m.end)
    }
    return out
  }
  words := func(t) {
    w := text.re_find(`\b\w+\b`, t, -1)
    if w == undefined { return 0 }
    return len(w)
  }
  // Blocks: runs of lines that are not blank. A heading, a table and a code block are not prose.
  blocks := text.re_find(`(?m)(?:^[^\n]*\S[^\n]*(?:\n|$))+`, s, -1)
  if blocks == undefined { blocks = [] }
  // The items of a list, each one on its own: an item is a sentence or a few, not a paragraph.
  items := func(blk) {
    if !text.re_match(`^\s*([-*+]|\d+\.)\s`, blk.text) { return [blk] }
    found := text.re_find(`(?m)^[ \t]*(?:[-*+]|\d+\.)\s[^\n]*(?:\n|$)(?:^[ \t]+(?:[^-*+\d\s]|\d+[^.\d\n]|[-*+]\S)[^\n]*(?:\n|$))*`, blk.text, -1)
    if found == undefined { return [blk] }
    out := []
    for f in found { out = append(out, {text: f[0].text, begin: blk.begin + f[0].begin}) }
    return out
  }

  // The table: [phrase, the word to use]. scripts/agda-check.sh reads these lines.
  table := [
    ["proprietary", "closed source"],
    ["PID", "persistent identifier"]]
  for row in table {
    found := text.re_find(`(?i)\b` + row[0] + `\b`, s, -1)
    if found == undefined { continue }
    for f in found { matches = append(matches, {begin: f[0].begin, end: f[0].end}) }
  }
