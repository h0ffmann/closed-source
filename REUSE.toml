version = 1

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Matheus Hoffmann"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["scripts/**", "tools/**", "agda/**", ".github/**", "justfile", "flake.nix", "flake.lock", "site/**", "unison/**/*.u"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Matheus Hoffmann"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["format/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Matheus Hoffmann"
SPDX-License-Identifier = "MIT"

# Adapted from Bruno Valério's templates (MIT): their notice stays with the adapted files.
[[annotations]]
path = [".github/pull_request_template.md", ".github/ISSUE_TEMPLATE/**"]
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Bruno Guilhermo de Barros Valério", "2026 Matheus Hoffmann"]
SPDX-License-Identifier = "MIT"

# Full texts copied as is under works/ (the ouro-get skill): public domain, each file's reasoning
# in works/index.md.
[[annotations]]
path = ["works/**/*.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# Copied as is from openai/math (works/index.md): Apache-2.0, the licence of that repository.
[[annotations]]
path = ["works/openai/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 OpenAI"
SPDX-License-Identifier = "Apache-2.0"
