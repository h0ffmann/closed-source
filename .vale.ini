# Vale: the prose rules of AGENTS.md ("Short sentences. Active voice. No undefined jargon. Numbers
# over adjectives.") as rules that can fail. Part of `just md-quality`; the rules are in
# .vale/styles/fabric/ and docs/4-ways-of-working/md-quality.md says where each comes from.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = fabric
# The cite line, the stamps and other HTML comments are not prose.
BlockIgnores = (?s)<!--.*?-->

# A paper's ASD-STE100 text (papers/<slug>/prose-ste/) gets the style `ste` as well:
# docs/4-ways-of-working/ste100.md. A quotation, a citation marker and a heading anchor are not
# the STE writer's words, so the rules do not count them; an STE pass never changes them, and
# `tools/fabric ste-check` fails if one does.
[papers/*/prose-ste/*.md]
BasedOnStyles = fabric, ste
BlockIgnores = (?s)<!--.*?-->
TokenIgnores = ("[^"]+"|“[^”]+”|\[@[^\]]+\]|\[-@[^\]]+\]|@[\w:.-]+|\{#[^}]+\})
