# Vale: the prose rules of AGENTS.md ("Short sentences. Active voice. No undefined jargon. Numbers
# over adjectives.") as rules that can fail. Part of `just md-quality`; the rules are in
# .vale/styles/fabric/ and docs/4-ways-of-working/md-quality.md says where each comes from.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = fabric
# The cite line, the stamps and other HTML comments are not prose.
BlockIgnores = (?s)<!--.*?-->
