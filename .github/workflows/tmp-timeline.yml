# temporary: regenerate timeline/thinkers.svg in CI (hex.pm is blocked in the agent sandbox). removed before merge.
name: tmp-timeline
on:
  push:
    branches: [ci/timeline-regen]
permissions:
  contents: write
jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file --command tools/fabric timeline
      - run: nix develop --no-update-lock-file --command tools/fabric timeline --check
      - run: |
          git config user.name github-actions && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add timeline/thinkers.svg && git commit -m "timeline: regenerate (tmp-timeline job)" && git push origin HEAD:refs/heads/ci/timeline-svg
