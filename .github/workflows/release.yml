# release — a pushed v* tag (`just release`, scripts/release.sh) becomes a published GitHub release
# with the rendered PDFs, the arXiv source bundles and their form fields attached (arXiv submission
# stays manual). Zenodo's own webhook then archives the release with .zenodo.json and mints the
# version DOI under the concept DOI, as in marola-dev/marola (its MIP-0079). No secret: the webhook
# is Zenodo's, switched on once by the owner at zenodo.org, and GITHUB_TOKEN creates the release.
# The Zenodo record holds the source tree at the tag; the PDFs are on the GitHub release.
# Hard rule: a tag that only moves submodule pointers since the previous v* tag gets no release,
# so no Zenodo version (`scripts/release.sh --guard`).
name: release

on:
  push:
    tags: ["v*"]
  # perma-doi.yml calls this after it pushes a tag: a tag pushed with GITHUB_TOKEN starts no
  # workflow by itself, so the daily release would otherwise never be published or minted.
  workflow_call:
    inputs:
      tag:
        description: The v* tag to publish (already pushed)
        type: string
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # A pushed tag names itself; a call from perma-doi.yml passes it.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: the tag is MAJOR.MINOR.PATCH and on main
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main
      - run: scripts/release.sh --guard "$TAG"
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file --command tools/fabric citation --check
      - run: nix develop --no-update-lock-file --command just check
      - run: nix develop --no-update-lock-file --command just arxiv
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" pdf/*.pdf build/arxiv/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --title "closed-source $TAG"
