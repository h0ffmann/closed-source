# pdf — build every paper with the pinned toolchain on each pull request and push to main, with
# pandoc warnings as errors (an unresolved citation fails), check the reference logs, and keep
# the PDFs as a workflow artifact. PDFs are not committed; releases carry them.
name: pdf

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/setup-toolchain.sh
      - run: python3 scripts/refs_check.py --self-test
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: papers-pdf
          path: pdf/*.pdf
          if-no-files-found: error
