# pdf — build every paper with the pinned toolchain (picasso's paper lab, through flake.nix) on each pull request and push to main, with
# pandoc warnings as errors (an unresolved citation fails), check the reference logs, and keep
# the PDFs as a workflow artifact. PDFs are not committed; releases carry them.
name: pdf

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: the lock is current
        run: nix flake metadata --no-update-lock-file >/dev/null
      - run: nix develop --no-update-lock-file --command just self-test
      - run: nix develop --no-update-lock-file --command just check
      - name: arXiv bundles compile with pdfLaTeX
        run: nix develop --no-update-lock-file --command just arxiv
      - uses: actions/upload-artifact@v4
        with:
          name: papers-pdf
          path: pdf/*.pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: arxiv-bundles
          path: build/arxiv/*
          if-no-files-found: error

  # The local-render hard rule (AGENTS.md): on a plain Ubuntu, with only Nix and apt's just,
  # `just book` renders the book.
  ubuntu-just:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The README's own install: the official nixos.org installer, no flakes config (the recipe
      # passes the flag itself).
      - name: install Nix as the README does
        run: |
          curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon --yes
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y just && just --version
      - run: just book
