# .md — the quality of the Markdown files, with three analysers from the flake's `md` shell
# (`just md-quality`, scripts/md-quality.sh): markdownlint-cli2 for the structure, Vale for the
# prose rules of AGENTS.md, lychee for links to files and headings that do not exist. No network:
# web links are the `live links` workflow's, which also runs on each pull request. Each analyser is first given a bad file and must
# refuse it. docs/4-ways-of-working/md-quality.md has the rules.
name: .md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file .#md --command scripts/md-quality.sh --self-test
      - run: nix develop --no-update-lock-file .#md --command scripts/md-quality.sh
